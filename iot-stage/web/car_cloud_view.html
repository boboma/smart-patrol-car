<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT-Stage 寻检车云俯视图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #e8edf4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 14px;
  }
  header {
    width: min(860px, 96vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; color: #1f2d3d; font-weight: 600; }
  #right { display: flex; align-items: center; gap: 10px; }
  #backend {
    font-size: 13px; padding: 4px 8px; border: 1px solid #ccd6e2;
    border-radius: 6px; width: 220px; color: #1f2d3d;
  }
  #connBadge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5a6b7f; }
  #connDot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #b0b9c4; transition: background .2s;
  }
  #connDot.on { background: #22a35c; box-shadow: 0 0 6px rgba(34,163,92,.6); }
  #connDot.warn { background: #d99a2e; box-shadow: 0 0 6px rgba(217,154,46,.6); }
  #stage {
    width: min(860px, 96vw);
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(31,45,61,.08);
    padding: 16px;
  }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
  #hud {
    width: min(860px, 96vw);
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(31,45,61,.08);
    padding: 14px 18px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
  }
  .cell { text-align: center; min-width: 90px; }
  .cell .k { font-size: 12px; color: #8896a6; margin-bottom: 4px; }
  .cell .v { font-size: 20px; font-weight: 600; color: #1f2d3d; font-variant-numeric: tabular-nums; }
  .cell .v.small { font-size: 14px; }
  #footerTip { font-size: 12px; color: #9aa7b5; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
  <header>
    <h1>☁️ 寻检车 · 云俯视图（华为云 IoTDA）</h1>
    <div id="right">
      <input id="backend" value="http://localhost:8000" title="业务后端地址">
      <div id="connBadge"><span id="connDot"></span><span id="connText">等待数据…</span></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="field" width="800" height="600"></canvas>
  </div>

  <div id="hud">
    <div class="cell"><div class="k">坐标 X</div><div class="v" id="hx">--</div></div>
    <div class="cell"><div class="k">坐标 Y</div><div class="v" id="hy">--</div></div>
    <div class="cell"><div class="k">朝向</div><div class="v" id="hh">--</div></div>
    <div class="cell"><div class="k">速度</div><div class="v" id="hs">--</div></div>
    <div class="cell"><div class="k">电量</div><div class="v" id="hb">--</div></div>
    <div class="cell"><div class="k">影子更新距今</div><div class="v small" id="hage">--</div></div>
  </div>

  <div id="footerTip">
    浏览器为「只看不控」观察端 · 轮询业务后端 /status（每 2 秒）· 数据源：华为云设备影子（运动时 5 秒一报）<br>
    实心车 = 本地航位推算（按速度与朝向外推，白色圈 = 最近一次影子上报位置）
  </div>

<script>
"use strict";

// ================================================================
// 与 lab01 car_view.html 的三点不同（课堂对比点）：
//   1. 数据源：WS 推送(100ms) -> HTTP 轮询(2s)，因为云上最新数据就是影子(5s 一报)
//   2. 位置平滑：两次影子更新之间做「航位推算」——按 speed/heading 本地外推
//      （无人车/游戏联机的经典补偿技术，漂移由下一次影子更新自动校正）
//   3. 在线判定：三态徽标——绿=车在线 / 黄=车离线(影子仍可查) / 灰=后端不通
// ================================================================

var POLL_MS = 2000;             // 轮询周期
var FIELD_W = 800, FIELD_H = 600;
var TRAIL_MAX = 120;            // 轨迹点数（约 30 秒）
var TRAIL_TICK_MS = 250;        // 轨迹采样间隔
var VEL = 0.2;                  // 速度换算：car_mqtt_client.py 每秒位移 = speed * 0.2 px

var backendInput = document.getElementById("backend");
var canvas = document.getElementById("field");
var ctx = canvas.getContext("2d");

// shadow = 最近一次云上报（权威值）；car = 推算后的显示值
var shadow = null;              // {x, y, heading, speed, battery, at}
var car = null;                 // {x, y, heading, speed, battery}
var shadowMarker = null;        // {x, y} 影子上报点（白色圈）
var trail = [];
var lastTrailAt = 0;
var online = null;              // null=未知 true/false
var backendOk = null;

function baseUrl() { return backendInput.value.replace(/\/+$/, ""); }

// ---------------- 轮询 ----------------
function poll() {
  fetch(baseUrl() + "/status", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (st) {
      var wasBackendOk = backendOk;
      backendOk = !!st.ok;
      if (backendOk && !wasBackendOk) setConn();
      if (!st.ok || st.x === null) { if (backendOk) { online = false; setConn(); } return; }
      var wasOnline = online;
      online = !!st.online;
      if (online !== wasOnline) setConn();

      // 新影子到达：把基准值钉到权威位置（同时校正航位推算累积的漂移）
      shadow = { x: st.x, y: st.y, heading: st.heading, speed: st.speed,
                 battery: st.battery, at: performance.now() };
      if (!car) {
        car = { x: st.x, y: st.y, heading: st.heading, speed: st.speed, battery: st.battery };
      } else {
        car.heading = st.heading;
        car.speed = st.speed;
        car.battery = st.battery;
      }
      shadowMarker = { x: st.x, y: st.y };
      updateHud();
    })
    .catch(function () {
      if (backendOk !== false) { backendOk = false; online = null; setConn(); }
    });
}
setInterval(poll, POLL_MS);
backendInput.addEventListener("change", poll);

// ---------------- 徽标/HUD ----------------
function setConn() {
  var dot = document.getElementById("connDot");
  var text = document.getElementById("connText");
  if (backendOk === false) { dot.className = ""; text.textContent = "后端不通"; return; }
  if (online === true) { dot.className = "on"; text.textContent = "车在线"; }
  else if (online === false) { dot.className = "warn"; text.textContent = "车离线(影子)"; }
  else { dot.className = ""; text.textContent = "等待数据…"; }
}

function updateHud() {
  if (!shadow) return;
  document.getElementById("hx").textContent = shadow.x;
  document.getElementById("hy").textContent = shadow.y;
  document.getElementById("hh").textContent = shadow.heading + "°";
  document.getElementById("hs").textContent = shadow.speed;
  document.getElementById("hb").textContent = shadow.battery + "%";
  document.getElementById("hage").textContent =
    Math.round((performance.now() - shadow.at) / 1000) + " 秒前";
}

// ---------------- 航位推算 + 渲染 ----------------
// heading 约定与 car_mqtt_client.py 一致：0°=朝上(-Y)，顺时针增
function step(now) {
  if (car && shadow) {
    var dt = (now - shadow.at) / 1000;      // 距最近一次影子上报的秒数
    if (car.speed !== 0 && online !== false) {
      var rad = car.heading * Math.PI / 180;
      car.x = Math.min(Math.max(shadow.x + car.speed * VEL * dt * Math.sin(rad), 10), FIELD_W - 10);
      car.y = Math.min(Math.max(shadow.y - car.speed * VEL * dt * Math.cos(rad), 10), FIELD_H - 10);
    } else {
      car.x = shadow.x; car.y = shadow.y;
    }
    // 轨迹采样（推算中的位置也画，线更连贯）
    if (now - lastTrailAt > TRAIL_TICK_MS) {
      trail.push({ x: car.x, y: car.y });
      if (trail.length > TRAIL_MAX) trail.shift();
      lastTrailAt = now;
    }
  }
}

function headingRad(h) { return h * Math.PI / 180; }

function drawGrid() {
  ctx.fillStyle = "#f3f7fb";
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  ctx.strokeStyle = "#dfe7f0";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= FIELD_W; gx += 50) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, FIELD_H); ctx.stroke();
  }
  for (var gy = 0; gy <= FIELD_H; gy += 50) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(FIELD_W, gy); ctx.stroke();
  }
  ctx.strokeStyle = "#c9d5e2";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, FIELD_W - 2, FIELD_H - 2);
  ctx.fillStyle = "#b9c5d3";
  ctx.font = "12px sans-serif";
  ctx.fillText("N ↑  (0,0) 左上角 · 场地 800 × 600", 10, 18);
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.lineWidth = 2;
  for (var i = 1; i < trail.length; i++) {
    var alpha = i / trail.length;
    ctx.strokeStyle = "rgba(64,132,220," + (alpha * 0.55).toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
}

function drawShadowMarker() {
  if (!shadowMarker) return;
  ctx.strokeStyle = "rgba(255,255,255,.95)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(shadowMarker.x, shadowMarker.y, 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = "rgba(31,45,61,.25)";
  ctx.beginPath();
  ctx.arc(shadowMarker.x, shadowMarker.y, 27, 0, Math.PI * 2);
  ctx.stroke();
}

function drawCar() {
  var rad = headingRad(car.heading);
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(rad);

  ctx.fillStyle = "rgba(31,45,61,.15)";
  ctx.save(); ctx.translate(3, 3); roundRect(-15, -22, 30, 44, 6); ctx.fill(); ctx.restore();

  var moving = car.speed !== 0;
  var body = moving ? (car.speed > 0 ? "#2f7bd9" : "#c88719") : "#7a8a9c";
  ctx.fillStyle = body;
  roundRect(-15, -22, 30, 44, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = "rgba(255,255,255,.55)";
  roundRect(-11, -4, 22, 16, 3);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(-8, -8); ctx.lineTo(8, -8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawIdleHint() {
  ctx.fillStyle = "#8b99a9";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("等待小车状态…（确认 app.py 业务后端已启动）", FIELD_W / 2, FIELD_H / 2);
  ctx.textAlign = "start";
}

function render(now) {
  step(now);
  drawGrid();
  if (car) { drawTrail(); drawShadowMarker(); drawCar(); updateHud(); }
  else { drawIdleHint(); }
  requestAnimationFrame(render);
}

poll();
requestAnimationFrame(render);
</script>
</body>
</html>
